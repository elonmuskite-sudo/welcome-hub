name: Set up production (Supabase database + Vercel env)

# Run from GitHub → Actions → "Set up production" → Run workflow.
# You are prompted for the Supabase address and anon key (both browser-safe).
# Server-only values come from GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY, VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID,
#   RESEND_API_KEY, RESEND_FROM,
#   APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID,
#   SUPABASE_POOLER_URL, VERCEL_DEPLOY_HOOK_URL (required only for Appwrite cutover)
on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Supabase project address (https://xxxx.supabase.co)'
        required: true
      supabase_anon_key:
        description: 'Supabase anon / publishable key'
        required: true
      run_sql:
        description: 'Initialize database schema (fresh Supabase project only; leave unchecked for existing projects)'
        type: boolean
        default: false
      apply_appwrite_migration:
        description: 'Apply the Appwrite identity-link table migration to an existing database'
        type: boolean
        default: false
      enable_appwrite:
        description: 'Switch Vercel production build to Appwrite Auth after all Appwrite paths have been verified'
        type: boolean
        default: false
      confirm_appwrite_ready:
        description: 'Confirm all enabled Appwrite Auth/data/storage paths were migrated and tested in a staging deployment'
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Appwrite cutover prerequisites
        if: ${{ inputs.enable_appwrite }}
        env:
          ENABLE_APPWRITE: ${{ inputs.enable_appwrite }}
          CONFIRM_APPWRITE_READY: ${{ inputs.confirm_appwrite_ready }}
          RUN_SQL: ${{ inputs.run_sql }}
          APPLY_APPWRITE_MIGRATION: ${{ inputs.apply_appwrite_migration }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test "$ENABLE_APPWRITE" = "true" || { echo "Appwrite cutover was not explicitly selected."; exit 1; }
          test "$CONFIRM_APPWRITE_READY" = "true" || { echo "Verify all enabled Appwrite paths in staging, then explicitly confirm readiness."; exit 1; }
          if [ "$RUN_SQL" != "true" ] && [ "$APPLY_APPWRITE_MIGRATION" != "true" ]; then
            echo "Appwrite cannot be enabled until the identity-link migration is applied. Select the migration step or fresh-project schema setup."
            exit 1
          fi
          test -n "$APPWRITE_ENDPOINT" || { echo "Add APPWRITE_ENDPOINT to GitHub repo secrets first."; exit 1; }
          test -n "$APPWRITE_PROJECT_ID" || { echo "Add APPWRITE_PROJECT_ID to GitHub repo secrets first."; exit 1; }
          test -n "$SUPABASE_POOLER_URL" || { echo "Add SUPABASE_POOLER_URL to GitHub repo secrets first."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Add SUPABASE_SERVICE_ROLE_KEY to GitHub repo secrets first."; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "Add SUPABASE_DB_URL to GitHub repo secrets first."; exit 1; }
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "Create a Vercel Production deploy hook and add its URL as VERCEL_DEPLOY_HOOK_URL."; exit 1; }

      - name: Run database schema
        if: ${{ inputs.run_sql }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Add the SUPABASE_DB_URL repo secret first."; exit 1; }
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f docs/supabase-schema.sql

      - name: Apply Appwrite identity-link migration
        if: ${{ inputs.apply_appwrite_migration && !inputs.run_sql }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Add the SUPABASE_DB_URL repo secret first."; exit 1; }
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/migrations/20261013232516_appwrite_identity_links.sql

      - name: Add environment variables to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          IN_URL: ${{ inputs.supabase_url }}
          IN_ANON: ${{ inputs.supabase_anon_key }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          AUTH_PROVIDER: ${{ inputs.enable_appwrite && 'appwrite' || 'supabase' }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID" || { echo "Add VERCEL_TOKEN and VERCEL_PROJECT_ID repo secrets first."; exit 1; }
          test -n "$SERVICE_ROLE" || { echo "Add SUPABASE_SERVICE_ROLE_KEY to GitHub repo secrets first."; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "Add RESEND_API_KEY to GitHub repo secrets first."; exit 1; }
          test -n "$RESEND_FROM" || { echo "Add RESEND_FROM to GitHub repo secrets first."; exit 1; }
          team_query=""
          if [ -n "$VERCEL_ORG_ID" ]; then team_query="?teamId=$VERCEL_ORG_ID"; fi
          list_query="limit=100"
          if [ -n "$VERCEL_ORG_ID" ]; then list_query="$list_query&teamId=$VERCEL_ORG_ID"; fi
          env_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$env_file" "$response_file"' EXIT
          umask 077
          code=$(curl -sS -o "$env_file" -w '%{http_code}' "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?$list_query" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          [ "$code" -lt 300 ] && jq -e '.envs | type == "array"' "$env_file" >/dev/null || { echo "Failed to list Vercel environment variables (HTTP $code)."; exit 1; }
          put() { # name value type
            [ -n "$2" ] || { echo "Missing value for $1."; exit 1; }
            body=$(jq -n --arg k "$1" --arg v "$2" --arg t "$3" '{key:$k,value:$v,type:$t,target:["production"]}')
            match_count=$(jq --arg key "$1" '[.envs[]? | select(.key == $key and ((.target // []) | index("production")) and ((.gitBranch // "") == ""))] | length' "$env_file")
            if [ "$match_count" -gt 1 ]; then
              echo "Multiple Production variables exist for $1; resolve duplicates in Vercel first."
              exit 1
            fi

            if [ "$match_count" -eq 1 ]; then
              env_id=$(jq -r --arg key "$1" '.envs[] | select(.key == $key and ((.target // []) | index("production")) and ((.gitBranch // "") == "")) | .id' "$env_file")
              endpoint="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$env_id$team_query"
              method="PATCH"
              label="Updated"
            else
              endpoint="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env$team_query"
              method="POST"
              label="Added"
            fi
            code=$(curl -sS -o "$response_file" -w '%{http_code}' -X "$method" "$endpoint" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' -d "$body")
            [ "$code" -lt 300 ] && echo "$label $1 (Production)" || { echo "Failed to set $1 in Vercel (HTTP $code)."; exit 1; }
          }
          put VITE_SUPABASE_URL "$IN_URL" plain
          put SUPABASE_URL "$IN_URL" plain
          put VITE_SUPABASE_ANON_KEY "$IN_ANON" plain
          put SUPABASE_ANON_KEY "$IN_ANON" plain
          put SUPABASE_SERVICE_ROLE_KEY "$SERVICE_ROLE" sensitive
          put RESEND_API_KEY "$RESEND_API_KEY" sensitive
          put RESEND_FROM "$RESEND_FROM" plain
          put VITE_AUTH_PROVIDER "$AUTH_PROVIDER" plain
          if [ "$AUTH_PROVIDER" = "appwrite" ]; then
            put APPWRITE_ENDPOINT "$APPWRITE_ENDPOINT" plain
            put APPWRITE_PROJECT_ID "$APPWRITE_PROJECT_ID" plain
            put SUPABASE_POOLER_URL "$SUPABASE_POOLER_URL" sensitive
            put VITE_APPWRITE_ENDPOINT "$APPWRITE_ENDPOINT" plain
            put VITE_APPWRITE_PROJECT_ID "$APPWRITE_PROJECT_ID" plain
          fi
          if [ "$AUTH_PROVIDER" = "appwrite" ]; then
            hook_response="$(mktemp)"
            trap 'rm -f "$env_file" "$response_file" "$hook_response"' EXIT
            code=$(curl -sS -o "$hook_response" -w '%{http_code}' -X POST "$VERCEL_DEPLOY_HOOK_URL")
            [ "$code" -lt 300 ] && jq -e '.job.state == "PENDING" or .job.state == "BUILDING"' "$hook_response" >/dev/null || {
              echo "Vercel accepted environment values, but the production deploy hook failed (HTTP $code)."
              exit 1
            }
            echo "Appwrite environment configured; production deployment triggered. Verify it reaches Ready in Vercel before announcing cutover."
          else
            echo "Supabase Auth environment configured. Redeploy in Vercel if these values changed."
          fi
