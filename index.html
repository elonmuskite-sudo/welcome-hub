<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta
    name="description"
    content="Nexus Chat is a privacy-first messaging app for secure real-time conversations across the globe."
  />
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nexus Chat" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nexus Chat" />
  <meta property="og:description" content="Nexus Chat is a privacy-first messaging app for secure real-time conversations." />
  <meta property="og:url" content="https://nexus-chat-world.com" />
  <meta property="og:image" content="https://nexus-chat-world.com/logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nexus Chat" />
  <meta name="twitter:description" content="Nexus Chat is a privacy-first messaging app for secure real-time conversations." />
  <meta name="twitter:url" content="https://nexus-chat-world.com" />
  <link rel="canonical" href="https://nexus-chat-world.com" />
  <title>Nexus Chat</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo-192.png" />
  <!-- Critical bootstrap styles: paint an app shell before the JS bundle runs,
       so first contentful paint is not gated on the module graph. React's
       createRoot replaces this markup on mount. -->
  <style>
    #root { min-height: 100%; }
    .app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .app-splash__spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(226, 232, 240, 0.25);
      border-top-color: #e2e8f0;
      animation: app-splash-spin 0.8s linear infinite;
    }
    .app-splash__text { margin: 0; font-size: 14px; opacity: 0.8; }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: light) {
      .app-splash { background: #ffffff; color: #0f172a; }
      .app-splash__spinner { border-color: rgba(15, 23, 42, 0.2); border-top-color: #0f172a; }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-splash__spinner { animation: none; }
    }
  </style>
</head>
<body class="h-full">
  <noscript>Nexus Chat requires JavaScript to run.</noscript>
  <div id="root">
    <div class="app-splash" role="status" aria-live="polite">
      <div class="app-splash__spinner" aria-hidden="true"></div>
      <p class="app-splash__text">Loading Nexus Chat…</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
